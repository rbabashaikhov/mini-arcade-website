<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tetris · Arcade Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <small>ARCADE LAB / 03</small>
          <h1>Tetris</h1>
        </div>
        <div class="actions">
          <button id="pauseBtn">Pause</button
          ><button id="restartBtn">Restart</button>
        </div>
      </header>
      <section class="hud">
        <span>Score<strong id="score">0</strong></span
        ><span>Best<strong id="best">0</strong></span
        ><span id="extra"></span>
      </section>
      <div class="stage">
        <canvas
          tabindex="0"
          aria-label="Tetris board, hold and next pieces"
        ></canvas>
        <div class="overlay">
          <h2 id="stateTitle"></h2>
          <p>
            Find the fit. Clear complete rows. Use hold to save a piece for the
            perfect moment.
          </p>
          <button id="startBtn">Start game</button>
        </div>
      </div>
      <div class="controls" aria-label="Piece controls">
        <button data-action="hold">Hold</button
        ><button data-action="left" aria-label="Move left">←</button
        ><button data-action="rotate" aria-label="Rotate clockwise">↻</button
        ><button data-action="right" aria-label="Move right">→</button
        ><button data-action="down" aria-label="Soft drop">↓</button
        ><button data-action="drop">Drop</button>
      </div>
      <p class="hint">
        ← → move · ↑ / X rotate · Z reverse · ↓ soft drop · Space drop · C hold
        · P pause
      </p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>

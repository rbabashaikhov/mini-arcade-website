<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Hold the line. Clear the formation before it reaches your ship."
    />
    <title>Space Invaders — Arcade Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-state="ready">
    <main>
      <header>
        <div>
          <small>ARCADE LAB</small>
          <h1>Space Invaders</h1>
        </div>
        <div class="actions">
          <button id="pauseBtn" disabled>Pause</button
          ><button id="restartBtn">Restart</button>
        </div>
      </header>
      <section class="hud" aria-label="Game statistics">
        <div><span>Score</span><strong id="scoreValue">0</strong></div>
        <div><span>Best</span><strong id="bestValue">0</strong></div>
        <div><span>Lives</span><strong id="livesValue">3</strong></div>
        <div><span>Wave</span><strong id="levelValue">1</strong></div>
      </section>
      <div
        id="gameWrapper"
        class="arena"
        tabindex="0"
        aria-label="Space Invaders play field"
      >
        <canvas id="gameCanvas" aria-label="Space Invaders arena"></canvas>
        <section class="overlay" id="overlay">
          <small>SECTOR 08 / DEFENSE</small>
          <h2 id="overlayTitle">Space Invaders</h2>
          <p id="overlayText">
            Hold the line. Clear the formation before it reaches your ship.
          </p>
          <button id="startBtn">Start game</button>
        </section>
      </div>
      <nav class="touch" aria-label="Touch game controls">
        <div>
          <button data-key="ArrowLeft" aria-label="Move or rotate left">
            ←</button
          ><button data-key="ArrowRight" aria-label="Move or rotate right">
            →
          </button>
        </div>
        <div><button data-key="Space" class="fire">Fire ●</button></div>
      </nav>
      <p class="hint">← → or A D move · Space fire · P pause · R restart</p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
